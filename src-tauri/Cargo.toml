[package]
name = "coplayer"
version = "0.1.0"
description = "Local strategy game copilot"
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coplayer_lib"
# This proof ships a desktop executable; mobile static/shared libraries are not needed.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
base64 = "0.22"
rfd = "0.15"
sha2 = "0.10"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
